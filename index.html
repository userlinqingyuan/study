<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="使用 Vue 2、Element UI 与 ECharts 构建的个人学习数据统计可视化看板"
    />
    <meta name="theme-color" content="#f4f7fb" />
    <title>学习数据看板 · Study Lab</title>
    <script>
      // 在 Vue 挂载前应用主题，避免刷新时先闪一下日间配色。
      (function () {
        try {
          var savedTheme = localStorage.getItem('studylab:theme:v1')
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : (systemDark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'dark' ? '#121513' : '#f4f7fb')
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
